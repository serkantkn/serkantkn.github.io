name: Günlük indirme raporu

on:
  schedule:
    - cron: "0 6 * * *"   # her gün 09:00 (Türkiye)
  workflow_dispatch:

permissions:
  contents: read

concurrency: download-report

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Dünkü sayıları geri yükle
        uses: actions/cache/restore@v4
        with:
          path: download-state.json
          key: download-state-${{ github.run_id }}
          restore-keys: download-state-

      - name: Raporu hazırla ve gönder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 .github/scripts/download_report.py

      - name: Bugünkü sayıları sakla
        uses: actions/cache/save@v4
        with:
          path: download-state.json
          key: download-state-${{ github.run_id }}
